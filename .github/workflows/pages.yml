name: Publicar cuadro de mando (GitHub Pages)

# Publica la carpeta `sitio/` en GitHub Pages cada vez que cambia en la rama principal y también a mano. La actualización de datos (fase 4) la regenera y la vuelve a publicar.
on:
  push:
    branches: [main]
    paths: ["sitio/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sitio
      - id: deployment
        uses: actions/deploy-pages@v4
